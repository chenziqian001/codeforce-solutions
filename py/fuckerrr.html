<!DOCTYPE html>
<html lang="zh-CN">
   
    <head>
        <meta charset="utf-8">
        <title>修改</title>
    </head>
    <body>
        <p id="txt">改变我的样式</p>
        <button id="change">改变</button>
        <script>
            let btn=document.getElementById("change");
            function change(){
                let text=document.getElementById("txt");
                text.style.color="red";
                text.style.fontSize="30px";
            }
            btn.onclick=change;
        </script>
    </body>

</html>
